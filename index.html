<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Task Manager</title>
  <meta name="description" content="Tasklight is a responsive, mobile-first task manager built with HTML, CSS and vanilla JavaScript.">
  <meta name="theme-color" content="#A5856F">

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    try {
      var t = localStorage.getItem('tasklight.theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <!-- Fonts: 2 families, 3 weights (Montserrat 700, Roboto 400 + 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app">
    <!-- ============ HEADER ============ -->
    <header class="site-header">
      <div class="brand">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect width="28" height="28" rx="8" fill="currentColor"/>
          <path d="M8 14.5l4 4 8-9" fill="none" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Tasklight</span>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-ghost" type="button" aria-pressed="false">
          <span id="theme-label">Dark mode</span>
        </button>
        <button id="menu-toggle" class="btn btn-ghost menu-toggle" type="button"
                aria-expanded="false" aria-controls="sidebar">
          <span class="menu-icon" aria-hidden="true"></span>
          <span>Filters</span>
        </button>
      </div>
    </header>

    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="sidebar" aria-label="Task filters and progress">
      <nav aria-label="Filter tasks">
        <h2 class="side-title">Show</h2>
        <ul class="filter-list">
          <li><button class="filter-btn" type="button" data-filter="all" aria-pressed="true">
            <span>All tasks</span><span class="count" data-count="all">0</span></button></li>
          <li><button class="filter-btn" type="button" data-filter="active" aria-pressed="false">
            <span>To do</span><span class="count" data-count="active">0</span></button></li>
          <li><button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">
            <span>Done</span><span class="count" data-count="completed">0</span></button></li>
        </ul>
      </nav>

      <section class="progress-card" aria-labelledby="progress-heading">
        <h2 id="progress-heading" class="side-title">Progress</h2>
        <progress id="progress-bar" max="100" value="0" aria-labelledby="progress-heading"></progress>
        <p id="progress-label" class="muted">No tasks yet</p>
        <button id="clear-done" class="btn btn-outline" type="button">Clear completed</button>
      </section>
    </aside>

    <!-- ============ MAIN ============ -->
    <main id="main" class="main">
      <h1 class="page-title">My tasks</h1>

      <section class="panel" aria-labelledby="form-heading">
        <h2 id="form-heading" class="panel-title">Add a task</h2>

        <form id="task-form" novalidate>
          <div class="field field-title">
            <label for="task-title">Task name</label>
            <input id="task-title" name="title" type="text" maxlength="80"
                   placeholder="e.g. Finish project wireframes" autocomplete="off"
                   aria-describedby="title-error" required>
            <p id="title-error" class="error" role="alert"></p>
          </div>

          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="task-due">Due date (optional)</label>
            <input id="task-due" name="due" type="date" aria-describedby="due-error">
            <p id="due-error" class="error" role="alert"></p>
          </div>

          <div class="form-actions">
            <button id="submit-btn" class="btn btn-primary" type="submit">Add task</button>
            <button id="cancel-edit" class="btn btn-outline" type="button" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <div class="list-head">
          <h2 id="list-heading" class="panel-title" tabindex="-1">Task list</h2>

          <div class="list-tools">
            <div class="field field-inline">
              <label for="task-search">Search</label>
              <input id="task-search" type="search" placeholder="Search tasks" autocomplete="off">
            </div>
            <div class="field field-inline">
              <label for="task-sort">Sort by</label>
              <select id="task-sort">
                <option value="newest">Newest first</option>
                <option value="due">Due date</option>
                <option value="priority">Priority</option>
              </select>
            </div>
          </div>
        </div>

        <ul id="task-list" class="task-list"></ul>

        <div id="empty-state" class="empty" hidden>
          <p class="empty-title">Nothing here yet</p>
          <p class="muted">Add your first task using the form above.</p>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <p>Tasklight &middot; Project 1 &middot; DecodeLabs Full Stack Internship 2026</p>
    </footer>
  </div>

  <!-- Screen-reader announcements -->
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
